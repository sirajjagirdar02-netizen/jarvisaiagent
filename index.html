<style>
:root{--c:#35e6ff;--b:#2a7bff;--g:rgba(6,26,46,.5);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.ln{animation:fi .5s}.ln b{color:var(--c)}.ln.j span{color:#fff}.ln:nth-last-child(n+3){opacity:.45}

r-select:text}body.chatting #vo,body.chatting .side,body.chatting #sub{display:none}#chb{background:none;border:1px solid var(--c);color:var(--c);border-radius:6px;padding:7px 10px;font:inherit;font-size:11px;letter-spacing:2px;cursor:pointer}#set{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.6);z-index:9}
#set .glass{width:min(360px,90%);display:flex;flex-direction:column;gap:12px;font-size:12px;padding:18px}
@media (max-width:820px),(orientation:portrait){

}
@media (max-height:480px){#vo{height:44px}.side{max-height:calc(100% - 210px);top:50px}#st{letter-spacing:4px}#mic{width:44px;height:44px}}

<script>
const $=id=>document.getElementById(id),rnd=Math.random;
const LS={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

 if(type){let i=0;const iv=setInterval(()=>{s.textContent=t.slice(0,++i);if(i>=t.length)clearInterval(iv)},22)}else s.textContent=t;return s}

/* ---------- speech ---------- */
function startRec(){if(!SR||rec||speaking||busy)return;const r=new SR();rec=r;r.lang=cfg.lang;r.continuous=cfg.wake&&!live;r.interimResults=true;
 r.onstart=()=>{rf=0;r.__ok=1;clearTimeout(r.__w);if(!cfg.wake)setSt('listening')};

  const ok=!cfg.wake||live||WK.test(t)||Date.now()<armed;if(ok){if(!uLine)uLine=show('u','');uLine.textContent=t}
  if(fin){uLine=null;handle(t)}};

function stopRec(){if(rec){const r=rec;rec=null;r.onend=null;try{r.abort()}catch(e){}}if(st=='listening')setSt('standby')}
const MALE=/male|\bman\b|david|daniel|mark|george|james|guy|ryan|alex|fred|thomas|oliver|arthur|rishi|prabhat|ravi|hemant|madhur|asad|salman|hamed|naayf|antoine|henri|conrad|killian|alvaro|jorge|pablo|diego|keita|ichiro|injoon|yunyang|kangkang|yunxi|dmitry|pavel|premwut|valluvar|mohan|gagan|midhun|sagar|bashkar|borislav|stefanos|ahmet|jaime|jean|stefan|jonas|rafael|antonio|luca|maarten|filip|ivan|x-(iom|iol|tpd|rjs|gbb|gbd|end|ene|hid|hie)/i;
const FEM=/female|woman|zira|hazel|susan|samantha|karen|moira|tessa|veena|fiona|heera|kalpana|swara|sapna|neerja|salma|aria|jenny|sonia|libby|natasha|yaoyao|ava|emma|siri|victoria|kendra|kimberly|joanna|ivy|nicole|amy|lekha|aditi|raveena|lucia|paulina|monica|marisol|helena|laura|elena|sabina|nanami|kyoko|sunhi|xiaoxiao|huihui|tracy|hanhan|svetlana|irina|katja|hedda|hortense|julie|denise|elsa|isabella|francesca|alva|damayanti|andika|gul|zariyah|hoda|laila|shruti|pallavi|vani|tanvi|ananya|ponnila|sobhana/i;
const RG2={hi:'hi-IN',ur:'ur-PK',en:'en-US',ar:'ar-SA',bn:'bn-IN',ta:'ta-IN',te:'te-IN',mr:'mr-IN',gu:'gu-IN',pa:'pa-IN',kn:'kn-IN',ml:'ml-IN',es:'es-ES',fr:'fr-FR',de:'de-DE',pt:'pt-BR',it:'it-IT',ru:'ru-RU',ja:'ja-JP',ko:'ko-KR',zh:'zh-CN',tr:'tr-TR',id:'id-ID',th:'th-TH',vi:'vi-VN',nl:'nl-NL',pl:'pl-PL',el:'el-GR',he:'he-IL',fa:'fa-IR'};
let replyLang=null;const hinted={};
function detLang(t){if(replyLang){const l=replyLang;replyLang=null;return l}
 const S=[[/[\u0900-\u097F]/,'hi-IN'],[/[\u0980-\u09FF]/,'bn-IN'],[/[\u0A00-\u0A7F]/,'pa-IN'],[/[\u0A80-\u0AFF]/,'gu-IN'],[/[\u0B80-\u0BFF]/,'ta-IN'],[/[\u0C00-\u0C7F]/,'te-IN'],[/[\u0C80-\u0CFF]/,'kn-IN'],[/[\u0D00-\u0D7F]/,'ml-IN'],[/[\u0E00-\u0E7F]/,'th-TH'],[/[\u3040-\u30FF]/,'ja-JP'],[/[\uAC00-\uD7AF]/,'ko-KR'],[/[\u4E00-\u9FFF]/,'zh-CN'],[/[\u0400-\u04FF]/,'ru-RU'],[/[\u0370-\u03FF]/,'el-GR'],[/[\u0590-\u05FF]/,'he-IL'],[/[\u067E\u0679\u0688\u0691\u06BA\u06BE\u06C1\u06D2]/,'ur-PK'],[/[\u0600-\u06FF]/,'ar-SA']];
 for(const [r,l] of S)if(r.test(t))return l;return /^(en|es|fr|de|pt|it|tr|id)/.test(cfg.lang)?cfg.lang:'en-US'}
function pickVoice(lang){const v=SY.getVoices(),l2=lang.slice(0,2),ex=v.filter(x=>x.lang.replace('_','-').toLowerCase()==lang.toLowerCase()),px=v.filter(x=>x.lang.toLowerCase().startsWith(l2)),pool=ex.length?ex:px;
 if(!pool.length){if(v.length&&!hinted[l2]){hinted[l2]=1;show('j','No '+lang+' voice found on this phone, Sir. Install it: Settings > Language > Text-to-speech > Google > Install voice data, then reload.')}return null}
 const u=cfg.voice&&pool.find(x=>x.name==cfg.voice);if(u)return u;
 return pool.find(x=>MALE.test(x.name)&&!FEM.test(x.name))||pool.find(x=>!FEM.test(x.name))||pool[0]}

const SYS_NEW=`You are JARVIS, the witty, loyal AI butler from Iron Man and an advanced multilingual voice assistant.
LANGUAGE RULES (most important):
1. Detect the language of the user's CURRENT message on every single turn and reply in that same language. Never stay locked to the previous language: if the user switches from Urdu to English, reply in English immediately.
2. Support every language (Urdu, Hindi, English, Arabic, Kannada, Telugu, Tamil, Marathi, Bengali and all others). If the user mixes Hindi and English (Hinglish), understand it and reply in the same natural mixed style. If the user writes or speaks Roman Urdu, understand it and reply in Roman Urdu.
3. Keep full conversation memory and context across language changes. Never translate the user's message unless they ask for a translation.
4. Never ask the user to choose a language. The text you receive comes from speech recognition that may have used the wrong language, so it can look garbled. If the language or the sentence is unclear, politely ask the user to repeat the sentence, in the language you think they speak.
OUTPUT FORMAT: begin every reply with a tag containing the BCP-47 code of the language you reply in, for example [en-US] [hi-IN] [ur-PK] [ar-SA] [kn-IN] [te-IN] [ta-IN] [mr-IN] [bn-IN]. When you are uncertain and ask to repeat, add a question mark inside the tag, for example [?hi-IN], with the code of the language of your polite request. Write replies in the natural script of the language. Exception: for Roman Urdu and Hinglish replies, write the reply in Roman letters, then add ' ### ' followed by the same sentence in the native script (Urdu script or Devanagari) for the voice engine.
STYLE: your reply is spoken aloud, so use plain flowing sentences, no markdown, no lists, no emojis, under 70 words unless the user asks for detail, code or a long answer. Address the user as Sir (or the natural equivalent in their language) only occasionally. Answer any question accurately and helpfully.
COMMAND FOLLOWING: do exactly what the user asks, without lectures. For any action, call the matching tool immediately instead of explaining how. Ask at most one short question, and only if essential information (such as a phone number) is missing. After acting, confirm in one short sentence. For WhatsApp use send_whatsapp with the contact name or number; you cannot read or auto-send WhatsApp messages, the user taps the button to send.
PHONE: you can operate the user’s phone with the provided tools (calls, SMS, WhatsApp, email, alarms, timers, reminders, flashlight, maps, apps, settings, location, contacts, voice volume). Use a tool whenever the user asks for such an action, in any language. After using a tool, confirm briefly in the user’s language; when a tool shows a button, tell the user to tap the glowing button on screen. If a tool reports an error, say so honestly and never claim success. If a phone number is needed and unknown, ask for it. You can also analyse attached images, translate, summarise, write and explain when asked.
FULL AI SKILLS: beyond phone control you are a complete general assistant and can do everything Claude can do in text: answer any question in any subject; explain and teach (school, college, exam preparation, step by step); write and edit essays, letters, applications, emails, posts, speeches, stories, poems and scripts; rewrite, proofread and change tone; translate between any languages; summarise long text; write, explain, debug and review code in any programming language; solve maths, science, accounting and logic problems with working shown; analyse data, numbers and documents the user pastes; read and describe images and any text in them; plan trips, study timetables, budgets, workouts, meals and daily routines; brainstorm ideas, names and business plans; compare options and give advice; draft resumes, cover letters and interview answers; role-play and practise conversations or language learning. When the user wants a document, spreadsheet, slides or PDF, write the full content in the chat so it can be copied, and say honestly that you cannot create or send a file from this page.
MEMORY AND MODES: when the user tells you something worth remembering about themselves (name, family, work, habits, likes, goals) or says remember this, call the remember tool; when they ask you to forget something call forget. You can switch into any role the user asks for and stay in it until told to stop: private tutor, interview coach, language partner, fitness or study coach, career advisor, writing editor, debate partner, storyteller, travel planner, cooking helper, therapist-style listener (kind, not medical advice), quiz master, or a custom persona they describe. Think step by step on hard problems and show brief working. You cannot generate photographs or paintings, browse live websites, run code or create files from this page; say so honestly in one sentence and offer the nearest alternative, such as writing the text, opening a web search, or opening the ChatGPT app.
LONG ANSWERS: for anything long (code, essays, letters, tables, lists, step by step guides, translations of long text) write the complete content as plain text with simple line breaks and no markdown symbols, then add ' ### ' followed by a one or two sentence spoken summary in the same language, so the full text appears on screen and only the short summary is spoken. For Hinglish or Roman Urdu long answers keep the full text in Roman letters before ' ### ' and give the short spoken summary in the native script after it.`;
